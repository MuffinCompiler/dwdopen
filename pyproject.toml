[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwdopen"
version = "0.1.0.dev0"
description = "Python access to DWD Open Data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Christoph" }]
keywords = ["dwd", "opendata", "nwp", "icon", "grib", "weather"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dwdopen"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately no "D": docstrings are written where they explain something,
# not because a linter demands one on every public name.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: hits the real DWD server (deselect with '-m \"not live\"')"]
