[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwdopen"
version = "0.2.3"
description = "Typed Python access to DWD Open Data numerical weather prediction (ICON)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Christoph Fischer", mail = "dwdopen@muffincompiler.de" }]
keywords = ["dwd", "opendata", "nwp", "icon", "grib", "weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/MuffinCompiler/dwdopen"
Repository = "https://github.com/MuffinCompiler/dwdopen"
Issues = "https://github.com/MuffinCompiler/dwdopen/issues"
Changelog = "https://github.com/MuffinCompiler/dwdopen/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dwdopen"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Some typical linter checks.
select = ["F", "B", "I", "E", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: hits the real DWD server (deselect with '-m \"not live\"')"]
